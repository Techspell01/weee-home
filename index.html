<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Weee: plans, a live shopping list, pantry alerts and spending, shared between the people you live with." />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Weee" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" />
    <title>Weee</title>
  </head>
  <body>
    <div id="root">
      <!-- shown instantly while the app loads; the app's own start screen continues the same animation -->
      <div class="splash">
        <svg class="splash-mark" viewBox="0 0 200 200" width="132" height="132" aria-hidden="true">
          <defs>
            <linearGradient id="splashRim0" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff6060" /><stop offset="0.25" stop-color="#ffd65a" />
              <stop offset="0.5" stop-color="#60ffaa" /><stop offset="0.75" stop-color="#5ab4ff" /><stop offset="1" stop-color="#c478ff" />
            </linearGradient>
            <radialGradient id="splashLens0" cx="0.5" cy="0.15" r="0.9">
              <stop offset="0" stop-color="#fff" stop-opacity="0.22" /><stop offset="0.6" stop-color="#fff" stop-opacity="0.04" /><stop offset="1" stop-color="#fff" stop-opacity="0.02" />
            </radialGradient>
          </defs>
          <circle class="splash-lens" cx="100" cy="100" r="78" fill="url(#splashLens0)" />
          <circle class="splash-rim" cx="100" cy="100" r="77" fill="none" stroke="url(#splashRim0)" stroke-width="3" pathLength="1" />
          <path class="splash-w" d="M60 76 L78 128 L100 92 L122 128 L140 76" fill="none" stroke="#F4F4F5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" pathLength="1" />
        </svg>
        <div class="splash-name">Weee</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
